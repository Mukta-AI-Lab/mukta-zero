x-logging: &dl
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  db:
    image: supabase/postgres:17.6.1.139
    container_name: mz-db
    restart: unless-stopped
    logging: *dl
    command: ["postgres","-c","config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD","pg_isready","-U","postgres","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [sb]
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: mz-auth
    restart: unless-stopped
    logging: *dl
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: ${JWT_ISSUER:-supabase}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Isolamento de tenant (2026-10-22): cadastro SÓ pelo edge signup-request (admin API, nasce banido
      # até aprovação). O /auth/v1/signup público dava JWT authenticated sem aprovação a qualquer um.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_DISABLE_SIGNUP: "true"
      # Auditoria externa 5.20 (2026-10-28): senha mínima, rate limit por IP REAL (o Kong preenche X-Real-IP
      # depois de validar o CF-Connecting-IP contra KONG_TRUSTED_IPS) e rotação de refresh token.
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
    networks: [sb]
  rest:
    image: postgrest/postgrest:v12.2.8
    container_name: mz-rest
    restart: unless-stopped
    logging: *dl
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # token de sessão encerrada (logout) volta 401 em toda requisição; a função tem de existir ANTES (senão toda
      # requisição falha) — criada pelo hardening de segurança / init do instalador
      PGRST_DB_PRE_REQUEST: public.mz_check_session
    networks: [sb]
  storage:
    image: supabase/storage-api:v1.19.3
    container_name: mz-storage
    restart: unless-stopped
    logging: *dl
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes: ["./data/storage:/var/lib/storage"]
    networks: [sb]
  realtime:
    image: supabase/realtime:v2.34.47
    container_name: mz-realtime
    restart: unless-stopped
    logging: *dl
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      APP_NAME: realtime
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks: [sb]
  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: mz-meta
    restart: unless-stopped
    logging: *dl
    depends_on: { db: { condition: service_healthy } }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [sb]
  edge-runtime:
    build: { context: ., dockerfile: Dockerfile.edge }
    image: mukta-edge-runtime:1.0
    container_name: mz-edge
    restart: unless-stopped
    logging: *dl
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGURL: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      EDGE_PORT: 9000
    volumes: ["./functions:/functions"]
    networks: [sb]
  kong:
    # 3.9.1 desde 29/10 (2.8.1 fora de suporte — auditoria externa 5.14); smoke 22/22 idêntico antes da troca
    image: kong:3.9.1
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    container_name: mz-kong
    restart: unless-stopped
    logging: *dl
    depends_on: [auth, rest, storage, realtime, edge-runtime]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,rate-limiting
      # IP real do cliente para o rate limit: só confia no CF-Connecting-IP quando a conexão vem de faixa
      # Cloudflare (a porta 8000 da origem deve aceitar SÓ essas faixas no firewall). Sem Cloudflare na frente,
      # o Kong usa o IP da conexão e ignora o cabeçalho.
      KONG_TRUSTED_IPS: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
      KONG_REAL_IP_HEADER: CF-Connecting-IP
      KONG_REAL_IP_RECURSIVE: "on"
    volumes: ["./kong/kong.yml:/home/kong/kong.yml:ro"]
    ports: ["0.0.0.0:8000:8000"]
    networks: [sb]
networks:
  sb: { name: mukta-sb, driver: bridge }
